name: Welcome Agent
on:
  pull_request_target:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-message: |
            Hey there! 👋 Thank you so much for contributing to LabZip! 
            As a student-focused project, every contribution means a lot. A maintainer will review your code shortly.